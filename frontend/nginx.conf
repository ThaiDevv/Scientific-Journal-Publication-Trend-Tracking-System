# ============================================
# Nginx Configuration - Frontend SPA + API Proxy
# ============================================

server {
    listen 80;
    server_name localhost;

    # Root directory - chứa React build output
    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- SPA Routing ----
    # Mọi route đều trả về index.html → React Router xử lý client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Docker DNS Resolver ----
    # Giúp Nginx giải mã tên miền 'backend' động mà không bị crash khi khởi động
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # ---- API Reverse Proxy ----
    # Forward /api/* requests tới Backend container
    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Swagger UI Proxy (cho development/demo) ----
    location /swagger-ui/ {
        proxy_pass $backend_upstream/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass $backend_upstream/v3/api-docs;
        proxy_set_header Host $host;
    }

    # ---- Cache static assets ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
